<!doctype html>
<html lang="es" data-theme="light" data-layout="mobile-sm">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Buscador · Pichibank</title>
  <meta name="build" content="__BUILD__">
  <meta name="description" content="Demo del buscador de Pichibank sobre la base de conocimiento y la base de personas: acciones, contactos, atajos, preguntas, productos y lectura de facturas.">
  <link rel="icon" type="image/svg+xml" href="../assets/pichibank-avatar.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0">
  <link rel="stylesheet" href="../assets/fonts/prelo/prelo.css?v=__BUILD__">
  <!-- Los mismos estilos de la app, en el mismo orden: nada propio de la demo -->
  <link rel="stylesheet" href="../assets/tokens.css?v=__BUILD__">
  <link rel="stylesheet" href="../assets/componentes-tokens.css?v=__BUILD__">
  <link rel="stylesheet" href="../assets/asistente.css?v=__BUILD__">
  <link rel="stylesheet" href="../assets/buscador.css?v=__BUILD__">
  <link rel="stylesheet" href="../assets/sistema.css?v=__BUILD__">
  <link rel="stylesheet" href="../assets/uku-app.css?v=__BUILD__">
  <link rel="stylesheet" href="../assets/componentes.css?v=__BUILD__">
  <!-- El reset base de la app (el mismo que index.html): caja border-box, sin margen y la fuente -->
  <style>*, *::before, *::after { box-sizing: border-box; } body { margin: 0; font-family: var(--sol-font, Prelo, -apple-system, sans-serif); }</style>
</head>
<body>
  <!-- La hoja del buscador de la app, abierta como página -->
  <div class="sx open" role="search">
    <div class="sx-back"></div>
    <div class="sx-panel">
      <div class="sx-head">
        <form class="sx-field" role="search" id="form">
          <span class="material-symbols-rounded" aria-hidden="true">search</span>
          <input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="¿Qué necesitas?" aria-label="Buscar o preguntar">
          <button type="button" class="sx-mic" id="mic" aria-label="Dictar"><span class="material-symbols-rounded">mic</span></button>
          <button type="button" class="sx-mic" id="cam" aria-label="Leer una factura con la cámara"><span class="material-symbols-rounded">photo_camera</span></button>
        </form>
        <button type="button" class="sx-cancel" id="cancel" aria-label="Ajustes de la demo"><span class="material-symbols-rounded">tune</span></button>
      </div>
      <div class="sx-results" id="out"></div>
    </div>
  </div>
  <div class="pf-toast" id="toast" role="status"></div>
  <script src="../assets/conocimiento.js?v=__BUILD__"></script>
  <script src="../buscador/persona.js?v=__BUILD__"></script>
  <script src="../buscador/lector.js?v=__BUILD__"></script>
  <script src="../buscador/demo.js?v=__BUILD__"></script>
</body>
</html>
