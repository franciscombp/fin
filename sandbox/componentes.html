    function clases(c, bp) { return c.split(/\s+/).filter(Boolean).map(function (x) { return '<code' + (bp ? ' class="is-bp"' : '') + '>' + esc(x) + '</code>'; }).join(''); }
    function item(it, sec) {
      return '<article class="cat-item" data-q="' + esc((it.n + ' ' + it.c + ' ' + (it.a || '') + ' ' + sec.t).toLowerCase()) + '">' +
        '<div class="cat-item__info"><p class="cat-item__t">' + esc(it.n) + '<span class="cat-warn material-symbols-rounded" title="No se ve: revisar">error</span></p>' + (it.d ? '<p class="cat-item__d">' + esc(it.d) + '</p>' : '') +
        '<div class="cat-code">' + clases(it.c, 1) + (it.a ? clases(it.a) : '') + '</div></div>' +
        '<div class="cat-stage' + (it.col ? ' cat-stage--col' : '') + (it.card ? ' cat-stage--card' : '') + '"' + (it.id ? ' id="' + it.id + '"' : '') + '>' + it.h + '</div></article>';
    }
    var cat = document.getElementById('cat'), indice = document.getElementById('indice');
    cat.innerHTML = S.map(function (s) {
      return '<section class="cat-sec" id="' + s.id + '"><div class="cat-sec__head"><h2>' + esc(s.t) + '</h2><a class="bp-link" href="' + FIGMA + s.fig + '" target="_blank" rel="noopener">Ver en Figma' + ms('open_in_new') + '</a></div>' + s.items.map(function (it) { return item(it, s); }).join('') + '</section>';
    }).join('');
    indice.innerHTML = S.map(function (s) { return '<a class="bp-filter-item" href="#' + s.id + '">' + esc(s.t) + '</a>'; }).join('');

    // Tarjetas: el arte y las filas del hub salen del mismo módulo que usa la app
    if (window.Tarjetas) {
      document.getElementById('artes').innerHTML = ['debito', 'black', 'siembra'].map(function (k) { return '<div class="cat-card">' + Tarjetas.arte(k, { ultimos: '4821' }) + '</div>'; }).join('');
      var filas = [['debito', 'Débito Digital', '******7890', '$ 1.906,04'], ['black', 'Mastercard Black ···5517', 'Cupo disponible', '$ 39.517,90'], ['siembra', 'Visa Siembra ···2087', 'Cupo disponible', '$ 8.000,00']];
      document.getElementById('filas-producto').innerHTML = '<div class="tab-panel is-active cat-w"><div class="bp-widget" style="padding:0 var(--bp-layout-card-padding)">' + filas.map(function (f) {
        return '<button class="product-row">' + Tarjetas.mini(f[0]) + '<span class="product-row__info"><span class="product-row__name">' + f[1] + '</span><span class="product-row__sub">' + f[2] + '</span></span><span class="product-row__amount">' + f[3] + '</span></button>';
      }).join('') + '</div></div>';
      Tarjetas.ajustar(document);
    }

    // Valores reales de los tokens (cambian con el tema)
    function valores() {
      var cs = getComputedStyle(document.documentElement);
      document.querySelectorAll('[data-val]').forEach(function (el) { var v = cs.getPropertyValue(el.dataset.val).trim(); el.textContent = v || 'sin valor'; });
    }
    // Revisión automática: marca lo que no se ve (alto 0) o un token de color sin valor
    function revisar() {
      valores();
      document.querySelectorAll('.cat-item').forEach(function (a) {
        var st = a.querySelector('.cat-stage'), mal = false;
        Array.prototype.forEach.call(st.children, function (c) { var r = c.getBoundingClientRect(); if (r.height < 4 || r.width < 4) mal = true; });
        st.querySelectorAll('[data-var]').forEach(function (c) { if (!getComputedStyle(document.documentElement).getPropertyValue(c.dataset.var).trim()) mal = true; });
        a.classList.toggle('is-warn', mal);
      });
    }
    var tema = document.getElementById('tema');
    function setTema(osc) { document.documentElement.setAttribute('data-theme', osc ? 'dark' : 'light'); tema.setAttribute('aria-pressed', String(osc)); tema.firstChild.textContent = osc ? 'light_mode' : 'dark_mode'; try { localStorage.setItem('cat_tema', osc ? 'dark' : 'light'); } catch (e) {} valores(); }
    tema.addEventListener('click', function () { setTema(document.documentElement.getAttribute('data-theme') !== 'dark'); });
    try { if (localStorage.getItem('cat_tema') === 'dark') setTema(true); } catch (e) {}

    // Filtro por nombre o clase
    document.getElementById('filtro').addEventListener('input', function (e) {
      var q = e.target.value.trim().toLowerCase();
      document.querySelectorAll('.cat-sec').forEach(function (s) {
        var alguno = false;
        s.querySelectorAll('.cat-item').forEach(function (a) { var ok = !q || a.dataset.q.indexOf(q) >= 0; a.hidden = !ok; alguno = alguno || ok; });
        s.hidden = !alguno;
      });
    });
    // Los segmentados, pestañas y chips del catálogo responden al toque, para probar sus estados
    cat.addEventListener('click', function (e) {
      var b = e.target.closest('.bp-segmented-item, .bp-tab-item');
      if (b) b.parentNode.querySelectorAll('[aria-selected]').forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); });
      if (!b) b = b || e.target.closest('.bp-filter-item:not([disabled]), .bp-icon-switch, .bp-list-item[aria-pressed]');
      if (b && b.hasAttribute('aria-pressed')) b.setAttribute('aria-pressed', String(b.getAttribute('aria-pressed') !== 'true'));
      else if (b && b.classList.contains('bp-filter-item')) b.setAttribute('aria-pressed', 'true');
    });
    document.fonts && document.fonts.ready.then(revisar);
    window.addEventListener('load', revisar);
