<!doctype html>
<html lang="es" data-theme="light" data-layout="mobile-sm">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sandbox · Pichibank</title>
  <meta name="build" content="__BUILD__">
  <link rel="icon" type="image/svg+xml" href="../assets/pichibank-avatar.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400..600,0..1,0">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../assets/tokens.css?v=__BUILD__">
  <link rel="stylesheet" href="../assets/asistente.css?v=__BUILD__">
  <link rel="stylesheet" href="../assets/buscador.css?v=__BUILD__">
  <link rel="stylesheet" href="../assets/sistema.css?v=__BUILD__">
  <link rel="stylesheet" href="../assets/pfm.css?v=__BUILD__">
  <link rel="stylesheet" href="../assets/uku-app.css?v=__BUILD__">
  <link rel="stylesheet" href="../assets/soporte.css?v=__BUILD__">
  <link rel="stylesheet" href="../assets/componentes.css?v=__BUILD__">
  <!-- El reset base de la app (el mismo que index.html): caja border-box, sin margen y la fuente -->
  <style>*, *::before, *::after { box-sizing: border-box; } body { margin: 0; font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }</style>
</head>
<body>
  <!-- El hub es solo panel y lanzadera: sin campo de búsqueda. La misma hoja de la app como esqueleto -->
  <div class="sx open">
    <div class="sx-back"></div>
    <div class="sx-panel">
      <div class="sx-results" id="out"></div>
    </div>
  </div>
  <div class="pf-toast" id="toast" role="status"></div>
  <script src="../sandbox/sandbox.js?v=__BUILD__"></script>
  <script src="../assets/conocimiento.js?v=__BUILD__"></script>
  <script src="../buscador/persona.js?v=__BUILD__"></script>
  <script>
    (function () {
      var S = window.Sandbox, out = document.getElementById('out'), esc = S.esc;
      // La lanzadera: los cuatro laboratorios, como los accesos del buscador de la app
      var LABS = [
        ['../buscador/', 'search', 'Buscador'],
        ['mundo.html', 'park', 'Mundo de Uku'],
        ['animaciones.html', 'animation', 'Animaciones'],
        ['conocimiento.html', 'database', 'Bases y repo']
      ];
      function tile(l) { return '<button class="sx-app" data-href="' + l[0] + '"><span class="sx-app__ic material-symbols-rounded">' + l[1] + '</span><span>' + esc(l[2]) + '</span></button>'; }
      function pintar() {
        var p = window.DemoPersona && DemoPersona.datos(), b = window.Conocimiento && Conocimiento.cargada() ? Conocimiento.base() : null, h = '';
        h += '<section class="sx-card"><h3>Sandbox de pruebas</h3><div class="sx-grid">' + LABS.map(tile).join('') + '</div></section>';
        if (p) h += S.chipsPersona(DemoPersona.lista(), p.id);
        // El panel: qué hay en cada laboratorio para la persona elegida
        var porTipo = {}; if (b) b.entradas.forEach(function (e) { porTipo[e.tipo] = (porTipo[e.tipo] || 0) + 1; });
        h += S.card(p ? p.nombre : 'Cargando…', p ? '<p class="sx-kb__p">' + esc(p.tipo) + ' · ' + esc(p.ciudad) + '</p>' + S.datos([
          ['Buscador', b ? b.entradas.length + ' entradas: ' + porTipo.faq + ' preguntas, ' + porTipo.producto + ' productos, ' + porTipo.accion + ' acciones' : '…'],
          ['Su agenda', p.contactos.length + ' contactos · ' + p.exterior.length + ' en el exterior · ' + p.servicios.filter(function (x) { return x.contrato; }).length + ' servicios'],
          ['Mundo de Uku', p.movimientos ? p.movimientos + ' movimientos para su bosque' : 'Sin movimientos: su mundo empieza vacío'],
          ['Sus productos', p.cuentas.length + ' cuentas · ' + p.tarjetas.length + ' tarjetas · ' + (p.prestamos.length + (p.hipoteca ? 1 : 0)) + ' préstamos · ' + p.inversiones.length + ' inversiones'],
          ['Animaciones', '11 animaciones · 12 efectos de háptica'],
          ['Bases y repo', (b ? Object.keys(b.sinonimos).length + ' sinónimos · ' : '') + DemoPersona.lista().length + ' personas · 7 carpetas']
        ]) : '', 'Persona activa');
        h += S.versionRow();
        out.innerHTML = h;
      }
      document.addEventListener('click', function (e) { var b = e.target.closest('[data-persona]'); if (!b) return; DemoPersona.set(b.dataset.persona); S.setPersona(b.dataset.persona); pintar(); S.aviso('Ahora eres ' + DemoPersona.datos().primerNombre); });
      pintar();
      Promise.all([DemoPersona.cargar('../assets/pfm/datos.json?v=' + S.BUILD), Conocimiento.listo()]).then(function () { DemoPersona.set(S.persona()); pintar(); }).catch(function () {});
    })();
  </script>
</body>
</html>
