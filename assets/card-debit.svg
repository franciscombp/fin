  </g>
  <text x="1224" y="150" text-anchor="end" fill="#0f265c" font-family="Arial Black, Arial, sans-serif" font-size="88" font-weight="900" font-style="italic" letter-spacing="-3">VISA</text>
  <text x="1224" y="200" text-anchor="end" fill="#0f265c" opacity=".8" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="34" font-weight="600">Débito</text>
  <!-- Chip y sin contacto -->
  <rect x="88" y="300" width="140" height="106" rx="18" fill="url(#chip)" stroke="#9e9e9e" stroke-width="2"/>
  <path d="M88 353H228M158 300V406M120 300V330Q120 353 88 353M196 300V330Q196 353 228 353M120 406V376Q120 353 88 353M196 406V376Q196 353 228 353" stroke="#9e9e9e" stroke-width="3" fill="none"/>
