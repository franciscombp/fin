    <path d="M0 0H84V56C84 71.5 71.5 84 56 84H0V0Z" fill="#0f265c"/>
    <path d="M27 21H51.6C61.5 21 67.5 27.3 67.5 36.3C67.5 45.3 61.5 51.6 51.6 51.6H39V63H27V21ZM39 31.2V41.4H50.7C54 41.4 55.8 39.3 55.8 36.3C55.8 33.3 54 31.2 50.7 31.2H39Z" fill="#ffdd00"/>
