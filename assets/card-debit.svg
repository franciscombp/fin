  <text x="88" y="640" fill="#0f265c" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="64" font-weight="600" letter-spacing="10">•••• •••• •••• 1234</text>
  <text x="88" y="730" fill="#0f265c" opacity=".75" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="2">DÉBITO DIGITAL</text>
