<svg xmlns="http://www.w3.org/2000/svg" width="1312" height="827" viewBox="0 0 1312 827">
  <!-- Tarjeta Débito Pichibank · colores de marca (brand-main #ffdd00 / brand-support #0f265c) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe433"/>
      <stop offset=".55" stop-color="#ffdd00"/>
      <stop offset="1" stop-color="#ffcb00"/>
    </linearGradient>
    <radialGradient id="glow" cx=".85" cy=".1" r=".7">
      <stop offset="0" stop-color="#fff8cc" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff8cc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f5f5"/>
      <stop offset=".5" stop-color="#bdbdbd"/>
      <stop offset="1" stop-color="#e0e0e0"/>
    </linearGradient>
  </defs>
  <rect width="1312" height="827" fill="url(#bg)"/>
  <rect width="1312" height="827" fill="url(#glow)"/>
  <!-- Ondas de marca -->
  <path d="M-40 640 C 260 520, 520 760, 820 620 S 1220 460, 1360 540 L1360 900 L-40 900 Z" fill="#ffc500" opacity=".55"/>
  <path d="M-40 720 C 300 620, 560 840, 900 700 S 1260 600, 1360 650 L1360 900 L-40 900 Z" fill="#ffb705" opacity=".45"/>
  <!-- Marca -->
