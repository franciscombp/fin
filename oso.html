<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uku · oso andino 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block">
<script>
  (function () { try { var t = localStorage.getItem('pb_theme'); var d = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.setAttribute('data-theme', d ? 'dark' : 'light'); } catch (e) {} })();
</script>
<link rel="stylesheet" href="./assets/tokens.css">
<link rel="stylesheet" href="./assets/destacados.css">
<link rel="stylesheet" href="./assets/asistente.css">
<style>
  html, body { margin: 0; background: var(--cx-surface); color: var(--cx-ink); font-family: Roboto, -apple-system, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top, 0px)) 0 calc(32px + env(safe-area-inset-bottom, 0px)); }
  header { padding: 8px 24px 0; }
  h1 { margin: 0; font: var(--cx-title); font-size: 32px; letter-spacing: -.6px; }
  header p { margin: 8px 0 0; font: var(--cx-sub); color: var(--cx-muted); }
  .stage { position: relative; height: 420px; margin-top: 16px; }
  .stage .b3d { position: absolute; inset: 0; }
  .ctl { padding: 24px; display: grid; gap: 28px; }
  .ctl h2 { margin: 0 0 12px; font: var(--cx-headline); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .row button { height: 44px; padding: 0 16px; border: 0; border-radius: 99px; background: var(--cx-fill); color: var(--cx-ink); font: 600 15px/1 Roboto, sans-serif; cursor: pointer; }
  .row button:active { transform: scale(.96); }
  label { display: flex; justify-content: space-between; font: var(--cx-body); }
  input[type=range] { width: 100%; accent-color: var(--cx-ink); }
  .note { font: var(--cx-sub); color: var(--cx-muted); margin: 0; }
  code { font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Uku</h1>
    <p>Oso andino 3D con esqueleto de 20 huesos. Tócalo para que reaccione.</p>
  </header>
  <div class="stage"><div class="b3d is-loading" id="b3d"><div class="b3d__fallback"><img class="as-oso" src="./assets/oso/oso.webp" alt=""></div></div></div>
  <section class="ctl">
    <div>
      <h2>Gestos</h2>
      <div class="row">
        <button data-g="wave">Saludar</button><button data-g="nod">Asentir</button><button data-g="think">Pensar</button>
        <button data-g="talk">Hablar</button><button data-g="happy">Celebrar</button>
      </div>
    </div>
    <div>
      <h2>Tomar objetos</h2>
      <div class="row"><button data-g="hold" data-o="coin">Moneda</button><button data-g="hold" data-o="leaf">Hoja</button></div>
    </div>
    <div>
      <h2>Salud financiera</h2>
      <label for="s"><span>El bosque crece con tus hábitos</span><b id="sv">50</b></label>
      <input id="s" type="range" min="0" max="100" value="50">
    </div>
    <p class="note">Huesos: <code>root · hips · spine · chest · neck · head · shoulder · upperarm · forearm · hand · thigh · shin · foot</code> (_L y _R). Los objetos se sujetan del hueso <code>hand_R</code>.</p>
  </section>
</main>
<script type="module">
  import * as B from './assets/bosque3d.js';
  const el = document.getElementById('b3d');
  if (B.supported()) { B.attach(el, { score: 50 }); el.classList.remove('is-loading'); el.classList.add('is-3d'); }
  document.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => B.play(b.dataset.g, b.dataset.o ? { hold: b.dataset.o } : null)));
  const s = document.getElementById('s'), sv = document.getElementById('sv');
  let t; s.addEventListener('input', () => { sv.textContent = s.value; clearTimeout(t); t = setTimeout(() => B.setScore(+s.value), 120); });
</script>
</body>
</html>
