<!-- Sección «Probar efectos» que estaba en Perfil (index.html). Los mismos efectos se prueban en sandbox/animaciones.html. -->
                <div class="section__title"><h2>Probar efectos</h2></div>
                <div class="card" id="fx-test-card">
                    <div class="list-item fx-test__status" id="fx-test-status" aria-live="polite"></div>
                    <button class="list-item" data-fx-test="tap">
                        <span class="avatar-cat"><span class="material-symbols-rounded">touch_app</span></span>
                        <span class="list-item__title">Tap<small class="fx-test__hint">Pulso corto + clic táctil</small></span>
                        <span class="material-symbols-rounded" style="color: var(--bp-text-helper);">play_arrow</span>
                    </button>
                    <button class="list-item" data-fx-test="select">
                        <span class="avatar-cat"><span class="material-symbols-rounded">radio_button_checked</span></span>
                        <span class="list-item__title">Selección<small class="fx-test__hint">Pulso + tono medio</small></span>
                        <span class="material-symbols-rounded" style="color: var(--bp-text-helper);">play_arrow</span>
                    </button>
                    <button class="list-item" data-fx-test="toggle">
                        <span class="avatar-cat"><span class="material-symbols-rounded">toggle_on</span></span>
                        <span class="list-item__title">Interruptor<small class="fx-test__hint">Doble pulso</small></span>
                        <span class="material-symbols-rounded" style="color: var(--bp-text-helper);">play_arrow</span>
                    </button>
                    <button class="list-item" data-fx-test="success">
                        <span class="avatar-cat"><span class="material-symbols-rounded">check_circle</span></span>
                        <span class="list-item__title">Éxito<small class="fx-test__hint">Golpe + campanas FM + brillo</small></span>
                        <span class="material-symbols-rounded" style="color: var(--bp-text-helper);">play_arrow</span>
                    </button>
                    <button class="list-item" data-fx-test="warning">
                        <span class="avatar-cat"><span class="material-symbols-rounded">warning</span></span>
                        <span class="list-item__title">Aviso<small class="fx-test__hint">Doble pitido</small></span>
                        <span class="material-symbols-rounded" style="color: var(--bp-text-helper);">play_arrow</span>
                    </button>
                    <button class="list-item" data-fx-test="error">
                        <span class="avatar-cat"><span class="material-symbols-rounded">error</span></span>
                        <span class="list-item__title">Error<small class="fx-test__hint">Zumbido + shake</small></span>
                        <span class="material-symbols-rounded" style="color: var(--bp-text-helper);">play_arrow</span>
                    </button>
                    <button class="list-item" data-fx-test="swipe">
                        <span class="avatar-cat"><span class="material-symbols-rounded">swipe</span></span>
                        <span class="list-item__title">Deslizar<small class="fx-test__hint">Barrido + clic de encaje</small></span>
                        <span class="material-symbols-rounded" style="color: var(--bp-text-helper);">play_arrow</span>
                    </button>
                    <button class="list-item" data-fx-test="open">
                        <span class="avatar-cat"><span class="material-symbols-rounded">expand_less</span></span>
                        <span class="list-item__title">Abrir panel<small class="fx-test__hint">Whoosh ascendente + campana</small></span>
                        <span class="material-symbols-rounded" style="color: var(--bp-text-helper);">play_arrow</span>
                    </button>
                    <button class="list-item" data-fx-test="close">
                        <span class="avatar-cat"><span class="material-symbols-rounded">expand_more</span></span>
                        <span class="list-item__title">Cerrar panel<small class="fx-test__hint">Whoosh descendente</small></span>
                        <span class="material-symbols-rounded" style="color: var(--bp-text-helper);">play_arrow</span>
                    </button>
                    <button class="list-item" data-fx-test="flip">
                        <span class="avatar-cat"><span class="material-symbols-rounded">flip</span></span>
                        <span class="list-item__title">Girar tarjeta<small class="fx-test__hint">Doble whoosh estéreo</small></span>
                        <span class="material-symbols-rounded" style="color: var(--bp-text-helper);">play_arrow</span>
                    </button>
                    <button class="list-item" data-fx-test="reveal">
                        <span class="avatar-cat"><span class="material-symbols-rounded">auto_awesome</span></span>
                        <span class="list-item__title">Revelar datos<small class="fx-test__hint">Cascada de campanas</small></span>
                        <span class="material-symbols-rounded" style="color: var(--bp-text-helper);">play_arrow</span>
                    </button>
                    <button class="list-item" data-fx-test="detent">
                        <span class="avatar-cat"><span class="material-symbols-rounded">linear_scale</span></span>
                        <span class="list-item__title">Umbral<small class="fx-test__hint">Clic seco al cruzar un límite</small></span>
                        <span class="material-symbols-rounded" style="color: var(--bp-text-helper);">play_arrow</span>
                    </button>
                    <button class="list-item" data-fx-test="welcome">
                        <span class="avatar-cat"><span class="material-symbols-rounded">waving_hand</span></span>
                        <span class="list-item__title">Bienvenida<small class="fx-test__hint">Barrido, golpe, acorde y lluvia de campanas</small></span>
                        <span class="material-symbols-rounded" style="color: var(--bp-text-helper);">play_arrow</span>
                    </button>
                </div>
