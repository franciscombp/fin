<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uku rig · prueba</title>
<style>html,body{margin:0;background:#f6f6f5;font:14px sans-serif}#stage{width:100vw;height:70vh}pre{margin:0;padding:12px;white-space:pre-wrap}</style>
</head><body>
<div id="stage"></div>
<pre id="out">cargando…</pre>
<script type="module">
import { loadUkuRig } from './assets/uku-rig.js';
const out = document.getElementById('out');
const lines = [];
const log = (m) => { lines.push(m); console.log('[uku-rig] ' + m); out.textContent = lines.join('\n'); };
const uku = await loadUkuRig(document.getElementById('stage'), { onLog: log });
window.uku = uku;
uku.start();
log('--- verificación ---');
log('gestos: ' + uku.clips.join(' | '));
// ?g=wave muestra un gesto; sin nada, recorre todos cada 4 s
const g = new URLSearchParams(location.search).get('g');
let i = 0; const next = () => { const n = g || uku.clips[i++ % uku.clips.length]; uku.playClip(n); log('gesto: ' + n); };
next(); if (!g) setInterval(next, 4000);
log('errores: ' + (uku.report.errors.length ? uku.report.errors.join('; ') : 'ninguno'));
</script></body></html>
